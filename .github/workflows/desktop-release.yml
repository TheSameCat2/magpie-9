# Unsigned Windows installer and the GitHub Releases update feed.
#
# A tag push vX.Y.Z builds the NSIS installer on windows-latest and publishes
# it with electron-builder (--publish always) to that tag's GitHub Release,
# along with latest.yml and the blockmap. releaseType is release, so the
# feed is not left as a draft. A hyphenated tag (vX.Y.Z-rc.1) is a prerelease
# and is not the update channel. Re-run the workflow on the same tag to
# replace the files.
#
# Pull requests that touch the shell build the installer and upload it as an
# Actions artifact only. They do not publish a Release.
#
# The installer is unsigned. Do not add a certificate or publisherName.

name: Desktop release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag is semver
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be vX.Y.Z or vX.Y.Z-prerelease (got ${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci
      - run: npm ci --prefix desktop

      - name: Stamp the installer version from the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm pkg set version="$RELEASE_VERSION"

      # electron-builder reads desktop/release-notes.md when it creates the
      # GitHub Release. Write it before the publish build.
      - name: Write release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: |
          cat > release-notes.md <<EOF
          Unsigned Windows build of MAGPIE-9 ${GITHUB_REF_NAME}. Windows does not trust this file. The app can download a newer release in the background and will ask before restarting.

          Download **MAGPIE-9-Setup-${RELEASE_VERSION}.exe** from the assets below. The \`.blockmap\` and \`latest.yml\` next to it are the update feed.

          1. If Edge says the file isn't commonly downloaded, open the download warning, choose **Keep**, then **Show more**, then **Keep anyway**. In Chrome, choose **Keep**.
          2. Open the installer. Windows shows **Windows protected your PC**.
          3. Click **More info**, then **Run anyway**.
          4. Open **MAGPIE-9** from the Start menu or the desktop shortcut. The first launch can show the same prompt. Click **More info**, then **Run anyway**, again.

          A work or school PC can hide **Run anyway**. If the message is from Smart App Control, it has no **Run anyway**. Turning Smart App Control off (Windows Security → App & browser control → Smart App Control) allows the installer. Windows will not let you turn Smart App Control back on without resetting the PC.

          After install, a newer release shows **Update available — Restart now / Later** at the bottom of the window. The run keeps going until you choose. The update is unsigned too, so SmartScreen can ask again.

          The same steps are at the top of the README: https://github.com/TheSameCat2/magpie-9#download-for-windows
          EOF

      - name: Build the NSIS installer
        if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run desktop:dist:win

      - name: Publish the NSIS installer
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          MAGPIE_PUBLISH: always
          MAGPIE_RELEASE_TYPE: ${{ contains(github.ref_name, '-') && 'prerelease' || 'release' }}
        run: npm run desktop:dist:win

      - name: Require the installer and the update feed
        shell: bash
        run: |
          shopt -s nullglob
          version="${RELEASE_VERSION:-}"
          if [[ -z "$version" ]]; then
            version="$(node -p "require('./desktop/package.json').version")"
          fi
          expected="MAGPIE-9-Setup-${version}.exe"
          files=(desktop/release/*.exe)
          if (( ${#files[@]} != 1 )); then
            echo "expected one NSIS installer in desktop/release, found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            ls -la desktop/release || true
            exit 1
          fi
          base="$(basename "${files[0]}")"
          echo "installer=$base"
          if [[ "$base" != "$expected" ]]; then
            echo "expected $expected, found $base"
            exit 1
          fi
          test -f "desktop/release/${expected}.blockmap"
          test -f desktop/release/latest.yml
          grep -q "$expected" desktop/release/latest.yml
          config="desktop/release/win-unpacked/resources/app-update.yml"
          test -f "$config"
          grep -q 'github' "$config"
          grep -q 'TheSameCat2' "$config"
          grep -q 'magpie-9' "$config"
          if grep -Eq 'publisherName|token:' "$config"; then
            echo "app-update.yml must not name a publisher or carry a token"
            cat "$config"
            exit 1
          fi
          echo "INSTALLER_NAME=$base" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

      - name: Title the GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          else
            extra+=(--latest)
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --title "MAGPIE-9 $GITHUB_REF_NAME" \
            --notes-file desktop/release-notes.md \
            "${extra[@]}"
