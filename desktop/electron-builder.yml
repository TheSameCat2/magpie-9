# Packages desktop/ only. The game arrives as extraResources (a real directory,
# not inside app.asar) because the protocol handler serves it with net.fetch,
# which does not read asar paths.
appId: app.magpie9.game
productName: MAGPIE-9
executableName: magpie-9
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
# `files` replaces the default glob. Production dependencies such as
# electron-updater are still packed by electron-builder's node_modules pass.
files:
  - src/**
  - '!src/**/*.test.js'
  - package.json
extraResources:
  - from: renderer
    to: renderer
asar: true
# Public GitHub Releases feed. releaseType release so the feed is not left
# in a draft (electron-updater ignores drafts). No token belongs in this file.
publish:
  provider: github
  owner: TheSameCat2
  repo: magpie-9
  releaseType: release
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
mac:
  category: public.app-category.games
  # Ad-hoc, not a Developer ID. Fuse flips invalidate Electron's signature;
  # without a new signature macOS SIGKILLs the binary. This runs on the
  # build machine only. Store builds need a real identity.
  identity: '-'
  hardenedRuntime: false
  target:
    - dir
linux:
  category: Game
  target:
    - AppImage
    - deb
win:
  # Resource editing (icon, name, version) still runs. Signing stays off so a
  # certificate in the environment cannot mark the installer as trusted.
  # publisherName stays unset. verifyUpdateCodeSignature false is the opt-out
  # that keeps an unsigned feed from being rejected as a bad signature.
  signExecutable: false
  verifyUpdateCodeSignature: false
  target:
    - nsis
nsis:
  # Dashes, not spaces. GitHub asset names and latest.yml have to be the
  # same string; a space is published as a dash and the updater misses it.
  artifactName: ${productName}-Setup-${version}.${ext}
