<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MAGPIE-9</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #07080c;
        --ice: #3de0ff;
        --mag: #ff2a6d;
        --ink: #dce8f0;
        --muted: #8a97a6;
        --sodium: #e8a030;
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: var(--void);
        overflow: hidden;
        font-family: "Share Tech Mono", ui-monospace, monospace;
        color: var(--ink);
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        overscroll-behavior: none;
        cursor: crosshair;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }
      #hud::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      #hud::after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 120px 30px rgba(7, 8, 12, 0.85);
        pointer-events: none;
      }

      .corner {
        position: absolute;
        width: 26px;
        height: 26px;
        border: 1px solid rgba(61, 224, 255, 0.35);
        opacity: 0.8;
      }
      .corner.tl {
        top: calc(18px + var(--sat));
        left: calc(18px + var(--sal));
        border-right: 0;
        border-bottom: 0;
      }
      .corner.tr {
        top: calc(18px + var(--sat));
        right: calc(18px + var(--sar));
        border-left: 0;
        border-bottom: 0;
      }
      .corner.bl {
        bottom: calc(18px + var(--sab));
        left: calc(18px + var(--sal));
        border-right: 0;
        border-top: 0;
      }
      .corner.br {
        bottom: calc(18px + var(--sab));
        right: calc(18px + var(--sar));
        border-left: 0;
        border-top: 0;
      }

      #score {
        position: absolute;
        top: calc(26px + var(--sat));
        left: calc(34px + var(--sal));
        font-size: 46px;
        line-height: 1;
        letter-spacing: 0.08em;
        color: var(--ice);
        text-shadow: 0 0 14px rgba(61, 224, 255, 0.55), 0 0 2px rgba(61, 224, 255, 0.9);
        transform-origin: left center;
      }
      #score.pop {
        animation: pop 0.34s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }
      #score.hot {
        color: #fff;
        text-shadow: 0 0 22px var(--ice), 0 0 4px #fff;
      }
      @keyframes pop {
        0% {
          transform: scale(1.5) translateY(-4px);
          filter: brightness(2);
        }
        100% {
          transform: scale(1) translateY(0);
          filter: brightness(1);
        }
      }
      #scoreLabel {
        position: absolute;
        top: calc(76px + var(--sat));
        left: calc(36px + var(--sal));
        font-size: 10px;
        letter-spacing: 0.32em;
        color: var(--muted);
      }
      #best {
        position: absolute;
        top: calc(34px + var(--sat));
        right: calc(34px + var(--sar));
        font-size: 14px;
        letter-spacing: 0.22em;
        color: var(--muted);
        text-align: right;
      }
      #best.beat {
        color: var(--sodium);
        text-shadow: 0 0 12px rgba(232, 160, 48, 0.6);
      }
      #vel {
        position: absolute;
        bottom: calc(28px + var(--sab));
        left: calc(36px + var(--sal));
        font-size: 12px;
        letter-spacing: 0.26em;
        color: var(--muted);
      }
      #vel b {
        color: var(--ice);
        font-weight: normal;
      }
      #velBar {
        position: absolute;
        bottom: calc(22px + var(--sab));
        left: calc(36px + var(--sal));
        width: 160px;
        height: 2px;
        background: rgba(138, 151, 166, 0.25);
      }
      #velBar i {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--ice), var(--mag));
        box-shadow: 0 0 8px rgba(61, 224, 255, 0.6);
        transition: width 0.3s ease-out;
      }
      #keys {
        position: absolute;
        bottom: calc(26px + var(--sab));
        right: calc(36px + var(--sar));
        font-size: 10px;
        letter-spacing: 0.26em;
        color: rgba(138, 151, 166, 0.65);
        text-align: right;
      }

      #center {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      #center.rise {
        animation: rise 0.5s ease-out both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translate(-50%, -44%);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
      }
      #title {
        position: relative;
        font-family: Orbitron, sans-serif;
        font-weight: 700;
        font-size: clamp(30px, 6.4vw, 68px);
        letter-spacing: 0.24em;
        color: var(--ink);
        text-shadow: 0 0 28px rgba(255, 42, 109, 0.35), 0 0 2px rgba(220, 232, 240, 0.8);
      }
      #title span {
        color: var(--mag);
        text-shadow: 0 0 22px rgba(255, 42, 109, 0.7);
      }
      #center.dead #title {
        color: var(--mag);
        animation: glitch 0.7s steps(2, end) 2;
      }
      @keyframes glitch {
        0% {
          text-shadow: -3px 0 var(--ice), 3px 0 var(--mag);
          transform: skewX(0deg);
        }
        20% {
          text-shadow: 4px 0 var(--ice), -4px 0 var(--mag);
          transform: skewX(-6deg) translateX(3px);
        }
        40% {
          text-shadow: -2px 0 var(--ice), 2px 0 var(--mag);
          transform: skewX(4deg);
        }
        60% {
          text-shadow: 6px 0 var(--ice), -6px 0 var(--mag);
          transform: translateX(-4px);
        }
        80% {
          text-shadow: -1px 0 var(--ice), 1px 0 var(--mag);
        }
        100% {
          text-shadow: 0 0 22px rgba(255, 42, 109, 0.7);
          transform: none;
        }
      }
      #rule {
        width: 100%;
        height: 1px;
        margin: 14px auto 0;
        background: linear-gradient(90deg, transparent, var(--ice), transparent);
        opacity: 0.6;
        position: relative;
        overflow: hidden;
      }
      #rule::after {
        content: "";
        position: absolute;
        top: -1px;
        left: -30%;
        width: 30%;
        height: 3px;
        background: linear-gradient(90deg, transparent, #fff, transparent);
        animation: sweep 2.4s linear infinite;
      }
      @keyframes sweep {
        to {
          left: 100%;
        }
      }
      #prompt {
        margin-top: 18px;
        font-size: 13px;
        letter-spacing: 0.34em;
        color: var(--ice);
        animation: blink 1.6s ease-in-out infinite;
      }
      #center.dead #prompt {
        animation: none;
        color: var(--ink);
        font-size: 15px;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      #sub {
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: var(--muted);
      }

      #toast {
        position: absolute;
        left: 50%;
        top: 63%;
        transform: translate(-50%, -50%);
        font-family: Orbitron, sans-serif;
        font-weight: 500;
        font-size: clamp(14px, 2.2vw, 22px);
        letter-spacing: 0.4em;
        color: var(--ice);
        opacity: 0;
        white-space: nowrap;
      }
      #toast.show {
        animation: toast 1.1s ease-out both;
      }
      #toast.ice {
        color: var(--ice);
        text-shadow: 0 0 18px rgba(61, 224, 255, 0.7);
      }
      #toast.sodium {
        color: var(--sodium);
        text-shadow: 0 0 18px rgba(232, 160, 48, 0.7);
      }
      #toast.mag {
        color: var(--mag);
        text-shadow: 0 0 18px rgba(255, 42, 109, 0.7);
      }
      @keyframes toast {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1.5);
          letter-spacing: 0.8em;
        }
        15% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          letter-spacing: 0.4em;
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -70%) scale(0.96);
        }
      }

      .hidden {
        display: none !important;
      }

      #sys {
        position: absolute;
        top: calc(62px + var(--sat));
        right: calc(22px + var(--sar));
        display: flex;
        gap: 8px;
        pointer-events: auto;
        z-index: 3;
      }
      #sys.playing {
        display: none;
      }
      #sys button {
        min-width: 48px;
        min-height: 48px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border: 1px solid rgba(61, 224, 255, 0.35);
        background: rgba(7, 8, 12, 0.55);
        color: var(--ice);
        font-family: inherit;
        font-size: 8px;
        letter-spacing: 0.22em;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #sys button:focus-visible {
        outline: 1px solid var(--ice);
        outline-offset: 2px;
      }
      #sys button.on {
        border-color: var(--sodium);
        color: var(--sodium);
      }
      #sys button svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
      }

      #zones {
        position: absolute;
        inset: 0;
        display: flex;
        pointer-events: none;
      }
      #zones .zone {
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: calc(64px + var(--sab));
        letter-spacing: 0.38em;
        font-size: 11px;
        color: rgba(61, 224, 255, 0.55);
        text-shadow: 0 0 12px rgba(61, 224, 255, 0.35);
      }
      #zones .zone.left {
        border-right: 1px dashed rgba(61, 224, 255, 0.28);
        background: linear-gradient(to right, rgba(61, 224, 255, 0.07), transparent 72%);
      }
      #zones .zone.right {
        color: rgba(255, 42, 109, 0.6);
        text-shadow: 0 0 12px rgba(255, 42, 109, 0.35);
        background: linear-gradient(to left, rgba(255, 42, 109, 0.07), transparent 72%);
      }

      #touch {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #touch .stick,
      #touch .tapring {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform;
      }
      #touch .stick {
        width: 0;
        height: 0;
      }
      #touch .stick-ring,
      #touch .stick-nub {
        position: absolute;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      #touch .stick-ring {
        width: 96px;
        height: 96px;
        left: 0;
        top: 0;
        border: 1px solid rgba(61, 224, 255, 0.45);
        box-shadow: 0 0 18px rgba(61, 224, 255, 0.2), inset 0 0 16px rgba(61, 224, 255, 0.08);
      }
      #touch .stick-nub {
        width: 22px;
        height: 22px;
        left: 0;
        top: 0;
        background: rgba(61, 224, 255, 0.85);
        box-shadow: 0 0 12px rgba(61, 224, 255, 0.7);
      }
      #touch .tapring {
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border: 1px solid rgba(255, 42, 109, 0.7);
        border-radius: 50%;
        box-shadow: 0 0 16px rgba(255, 42, 109, 0.35);
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(7, 8, 12, 0.72);
        z-index: 4;
      }
      #rotate {
        z-index: 5;
      }
      .overlay-card {
        text-align: center;
        padding: 0 28px;
      }
      .overlay-title {
        font-family: Orbitron, sans-serif;
        font-weight: 700;
        font-size: clamp(16px, 4.2vw, 28px);
        letter-spacing: 0.28em;
        color: var(--ice);
        text-shadow: 0 0 18px rgba(61, 224, 255, 0.45);
      }
      .overlay-sub {
        margin-top: 12px;
        font-size: 11px;
        letter-spacing: 0.28em;
        color: var(--muted);
      }
      .overlay-glyph {
        width: 54px;
        height: 34px;
        margin: 0 auto 16px;
        border: 2px solid var(--ice);
        border-radius: 4px;
        box-shadow: 0 0 14px rgba(61, 224, 255, 0.35);
        animation: tilt 1.8s ease-in-out infinite;
      }
      #rotate .fs-btn {
        pointer-events: auto;
        margin: 22px auto 0;
        min-width: 220px;
        min-height: 48px;
        padding: 10px 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid rgba(61, 224, 255, 0.45);
        background: rgba(7, 8, 12, 0.7);
        color: var(--ice);
        font-family: inherit;
        font-size: 11px;
        letter-spacing: 0.28em;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #rotate .fs-btn:focus-visible {
        outline: 1px solid var(--ice);
        outline-offset: 2px;
      }
      #rotate .fs-btn.on {
        border-color: var(--sodium);
        color: var(--sodium);
      }
      #rotate .fs-btn svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
      }
      #rotateFsHint {
        margin-top: 18px;
        max-width: 22em;
        line-height: 1.6;
      }
      @keyframes tilt {
        0%,
        100% {
          transform: rotate(-90deg);
        }
        40%,
        60% {
          transform: rotate(0deg);
        }
      }

      @media (max-height: 480px) {
        #score {
          font-size: 32px;
          top: calc(14px + var(--sat));
          left: calc(20px + var(--sal));
        }
        #scoreLabel {
          top: calc(50px + var(--sat));
          left: calc(22px + var(--sal));
          font-size: 9px;
        }
        #best {
          font-size: 12px;
          top: calc(16px + var(--sat));
          right: calc(20px + var(--sar));
        }
        #sys {
          top: calc(42px + var(--sat));
          right: calc(14px + var(--sar));
        }
        #title {
          font-size: clamp(22px, 8vh, 40px);
          letter-spacing: 0.16em;
        }
        #prompt {
          font-size: 11px;
          margin-top: 12px;
        }
        #sub {
          font-size: 10px;
        }
        #vel {
          bottom: calc(12px + var(--sab));
          left: calc(20px + var(--sal));
        }
        #velBar {
          bottom: calc(8px + var(--sab));
          left: calc(20px + var(--sal));
        }
        #keys {
          bottom: calc(12px + var(--sab));
          right: calc(20px + var(--sar));
        }
        #zones .zone {
          padding-bottom: calc(42px + var(--sab));
          font-size: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #hud *,
        #hud *::after {
          animation: none !important;
          transition: none !important;
        }
        #toast.show {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div id="score">0</div>
      <div id="scoreLabel">GATES</div>
      <div id="best">BEST 0</div>
      <div id="vel">VEL <b>12.0</b></div>
      <div id="velBar"><i></i></div>
      <div id="keys">M MUTE · B COLLIDER</div>
      <div id="sys">
        <button type="button" id="btnMute" aria-label="Mute" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10v4h3l5 4V6L7 10H4z" />
            <path d="M16 9.5a4 4 0 0 1 0 5" />
            <path d="M18.5 7a7 7 0 0 1 0 10" />
          </svg>
          <span class="label">MUTE</span>
        </button>
        <button type="button" id="btnFs" aria-label="Enter fullscreen" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 4H4v4" />
            <path d="M16 4h4v4" />
            <path d="M8 20H4v-4" />
            <path d="M16 20h4v-4" />
          </svg>
          <span class="label">FULL</span>
        </button>
      </div>
      <div id="zones" class="hidden" aria-hidden="true">
        <div class="zone left"><span>STRAFE</span></div>
        <div class="zone right"><span>FLAP</span></div>
      </div>
      <div id="touch" aria-hidden="true">
        <div class="stick hidden">
          <div class="stick-ring"></div>
          <div class="stick-nub"></div>
        </div>
        <div class="tapring hidden"></div>
      </div>
      <div id="center">
        <div id="title">MAGPIE<span>-9</span></div>
        <div id="rule"></div>
        <div id="prompt">FLAP TO ARM</div>
        <div id="sub">SPACE / CLICK · A D STRAFE</div>
      </div>
      <div id="toast"></div>
      <div id="paused" class="overlay hidden">
        <div class="overlay-card">
          <div class="overlay-title">PAUSED</div>
          <div class="overlay-sub">TAP TO RESUME</div>
        </div>
      </div>
      <div id="rotate" class="overlay hidden">
        <div class="overlay-card">
          <div class="overlay-glyph" aria-hidden="true"></div>
          <div class="overlay-title">ROTATE TO LANDSCAPE</div>
          <div class="overlay-sub">MAGPIE-9 PLAYS SIDEWAYS</div>
          <button type="button" id="btnRotateFs" class="fs-btn hidden" aria-label="Enter fullscreen" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 4H4v4" />
              <path d="M16 4h4v4" />
              <path d="M8 20H4v-4" />
              <path d="M16 20h4v-4" />
            </svg>
            <span class="label">ENTER FULLSCREEN</span>
          </button>
          <div id="rotateFsHint" class="overlay-sub hidden">
            THIS BROWSER CAN'T GO FULLSCREEN · ADD TO HOME SCREEN
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
