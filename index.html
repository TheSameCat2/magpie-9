<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAGPIE-9</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #07080c;
        --ice: #3de0ff;
        --mag: #ff2a6d;
        --ink: #dce8f0;
        --muted: #8a97a6;
        --sodium: #e8a030;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--void);
        overflow: hidden;
        font-family: "Share Tech Mono", ui-monospace, monospace;
        color: var(--ink);
        user-select: none;
        -webkit-user-select: none;
        cursor: crosshair;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }
      #hud::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      #hud::after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 120px 30px rgba(7, 8, 12, 0.85);
        pointer-events: none;
      }

      .corner {
        position: absolute;
        width: 26px;
        height: 26px;
        border: 1px solid rgba(61, 224, 255, 0.35);
        opacity: 0.8;
      }
      .corner.tl {
        top: 18px;
        left: 18px;
        border-right: 0;
        border-bottom: 0;
      }
      .corner.tr {
        top: 18px;
        right: 18px;
        border-left: 0;
        border-bottom: 0;
      }
      .corner.bl {
        bottom: 18px;
        left: 18px;
        border-right: 0;
        border-top: 0;
      }
      .corner.br {
        bottom: 18px;
        right: 18px;
        border-left: 0;
        border-top: 0;
      }

      #score {
        position: absolute;
        top: 26px;
        left: 34px;
        font-size: 46px;
        line-height: 1;
        letter-spacing: 0.08em;
        color: var(--ice);
        text-shadow: 0 0 14px rgba(61, 224, 255, 0.55), 0 0 2px rgba(61, 224, 255, 0.9);
        transform-origin: left center;
      }
      #score.pop {
        animation: pop 0.34s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }
      #score.hot {
        color: #fff;
        text-shadow: 0 0 22px var(--ice), 0 0 4px #fff;
      }
      @keyframes pop {
        0% {
          transform: scale(1.5) translateY(-4px);
          filter: brightness(2);
        }
        100% {
          transform: scale(1) translateY(0);
          filter: brightness(1);
        }
      }
      #scoreLabel {
        position: absolute;
        top: 76px;
        left: 36px;
        font-size: 10px;
        letter-spacing: 0.32em;
        color: var(--muted);
      }
      #best {
        position: absolute;
        top: 34px;
        right: 34px;
        font-size: 14px;
        letter-spacing: 0.22em;
        color: var(--muted);
        text-align: right;
      }
      #best.beat {
        color: var(--sodium);
        text-shadow: 0 0 12px rgba(232, 160, 48, 0.6);
      }
      #vel {
        position: absolute;
        bottom: 28px;
        left: 36px;
        font-size: 12px;
        letter-spacing: 0.26em;
        color: var(--muted);
      }
      #vel b {
        color: var(--ice);
        font-weight: normal;
      }
      #velBar {
        position: absolute;
        bottom: 22px;
        left: 36px;
        width: 160px;
        height: 2px;
        background: rgba(138, 151, 166, 0.25);
      }
      #velBar i {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--ice), var(--mag));
        box-shadow: 0 0 8px rgba(61, 224, 255, 0.6);
        transition: width 0.3s ease-out;
      }
      #keys {
        position: absolute;
        bottom: 26px;
        right: 36px;
        font-size: 10px;
        letter-spacing: 0.26em;
        color: rgba(138, 151, 166, 0.65);
        text-align: right;
      }

      #center {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      #center.rise {
        animation: rise 0.5s ease-out both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translate(-50%, -44%);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
      }
      #title {
        position: relative;
        font-family: Orbitron, sans-serif;
        font-weight: 700;
        font-size: clamp(30px, 6.4vw, 68px);
        letter-spacing: 0.24em;
        color: var(--ink);
        text-shadow: 0 0 28px rgba(255, 42, 109, 0.35), 0 0 2px rgba(220, 232, 240, 0.8);
      }
      #title span {
        color: var(--mag);
        text-shadow: 0 0 22px rgba(255, 42, 109, 0.7);
      }
      #center.dead #title {
        color: var(--mag);
        animation: glitch 0.7s steps(2, end) 2;
      }
      @keyframes glitch {
        0% {
          text-shadow: -3px 0 var(--ice), 3px 0 var(--mag);
          transform: skewX(0deg);
        }
        20% {
          text-shadow: 4px 0 var(--ice), -4px 0 var(--mag);
          transform: skewX(-6deg) translateX(3px);
        }
        40% {
          text-shadow: -2px 0 var(--ice), 2px 0 var(--mag);
          transform: skewX(4deg);
        }
        60% {
          text-shadow: 6px 0 var(--ice), -6px 0 var(--mag);
          transform: translateX(-4px);
        }
        80% {
          text-shadow: -1px 0 var(--ice), 1px 0 var(--mag);
        }
        100% {
          text-shadow: 0 0 22px rgba(255, 42, 109, 0.7);
          transform: none;
        }
      }
      #rule {
        width: 100%;
        height: 1px;
        margin: 14px auto 0;
        background: linear-gradient(90deg, transparent, var(--ice), transparent);
        opacity: 0.6;
        position: relative;
        overflow: hidden;
      }
      #rule::after {
        content: "";
        position: absolute;
        top: -1px;
        left: -30%;
        width: 30%;
        height: 3px;
        background: linear-gradient(90deg, transparent, #fff, transparent);
        animation: sweep 2.4s linear infinite;
      }
      @keyframes sweep {
        to {
          left: 100%;
        }
      }
      #prompt {
        margin-top: 18px;
        font-size: 13px;
        letter-spacing: 0.34em;
        color: var(--ice);
        animation: blink 1.6s ease-in-out infinite;
      }
      #center.dead #prompt {
        animation: none;
        color: var(--ink);
        font-size: 15px;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      #sub {
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: var(--muted);
      }

      #toast {
        position: absolute;
        left: 50%;
        top: 63%;
        transform: translate(-50%, -50%);
        font-family: Orbitron, sans-serif;
        font-weight: 500;
        font-size: clamp(14px, 2.2vw, 22px);
        letter-spacing: 0.4em;
        color: var(--ice);
        opacity: 0;
        white-space: nowrap;
      }
      #toast.show {
        animation: toast 1.1s ease-out both;
      }
      #toast.ice {
        color: var(--ice);
        text-shadow: 0 0 18px rgba(61, 224, 255, 0.7);
      }
      #toast.sodium {
        color: var(--sodium);
        text-shadow: 0 0 18px rgba(232, 160, 48, 0.7);
      }
      #toast.mag {
        color: var(--mag);
        text-shadow: 0 0 18px rgba(255, 42, 109, 0.7);
      }
      @keyframes toast {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1.5);
          letter-spacing: 0.8em;
        }
        15% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          letter-spacing: 0.4em;
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -70%) scale(0.96);
        }
      }

      .hidden {
        display: none !important;
      }

      @media (prefers-reduced-motion: reduce) {
        #hud *,
        #hud *::after {
          animation: none !important;
          transition: none !important;
        }
        #toast.show {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div id="score">0</div>
      <div id="scoreLabel">GATES</div>
      <div id="best">BEST 0</div>
      <div id="vel">VEL <b>12.0</b></div>
      <div id="velBar"><i></i></div>
      <div id="keys">M MUTE · B COLLIDER</div>
      <div id="center">
        <div id="title">MAGPIE<span>-9</span></div>
        <div id="rule"></div>
        <div id="prompt">FLAP TO ARM</div>
        <div id="sub">SPACE / CLICK · A D STRAFE</div>
      </div>
      <div id="toast"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
